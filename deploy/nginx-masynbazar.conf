# /etc/nginx/sites-available/masynbazar  (reference copy; certbot-managed lines kept)
# Companion: /etc/nginx/conf.d/masynbazar-ratelimit.conf must define the zone:
#   limit_req_zone $binary_remote_addr zone=mb_contact:10m rate=10r/m;

server {
    server_name masynbazar.com www.masynbazar.com;
    client_max_body_size 50M;

    root /var/www/masynbazar/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Contact form: extra per-IP throttle at the edge (app has its own limits too)
    location = /api/contact {
        limit_req zone=mb_contact burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/masynbazar.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/masynbazar.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.masynbazar.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = masynbazar.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name masynbazar.com www.masynbazar.com;
    listen 80;
    return 404; # managed by Certbot
}
